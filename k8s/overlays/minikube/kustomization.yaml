apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ─── Base ───────────────────────────────────────────────────────────────────
resources:
- ../../base

# ─── Image tags — mis à jour automatiquement par Jenkins ────────────────────
# Le pipeline Jenkins exécute :
#   kustomize edit set image collector-shop-backend=collector-shop-backend:$BUILD_NUMBER
#   kustomize edit set image collector-shop-frontend=collector-shop-frontend:$BUILD_NUMBER
images:
- name: collector-shop-backend
  newName: collector-shop-backend
  newTag: "46"
- name: collector-shop-frontend
  newName: collector-shop-frontend
  newTag: "46"

# ─── Patches Minikube (NodePort + imagePullPolicy: Never) ───────────────────
patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never
  target:
    kind: Deployment
    name: backend
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Never
  target:
    kind: Deployment
    name: frontend

# ─── Labels spécifiques à l'environnement (Production) ─────────────────────
commonLabels:
  environment: production
