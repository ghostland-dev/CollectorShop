apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: collector-shop
type: Opaque
stringData:
  JWT_SECRET: "change-me-in-production-k8s-secret"
  JWT_REFRESH_SECRET: "change-me-in-production-refresh-k8s-secret"
  DATABASE_URL: "postgresql://collector:collector_password@postgres:5432/collector_shop?schema=public"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: collector-shop
data:
  REDIS_URL: "redis://redis:6379"
  MINIO_ENDPOINT: "minio"
  MINIO_PORT: "9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
  MINIO_BUCKET: "collector-shop-images"
  MINIO_USE_SSL: "false"
  MINIO_PUBLIC_URL: "http://localhost:9000"
  VICTORIAMETRICS_URL: "http://victoriametrics:8428/api/v1/import/prometheus"
  PORT: "5000"
  NODE_ENV: "production"
  FRONTEND_URL: "http://localhost:3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: collector-shop
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-redis
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z redis 6379; do echo waiting for redis; sleep 2; done;']
      containers:
      - name: backend
        image: collector-shop-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_SECRET
        - name: JWT_REFRESH_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: JWT_REFRESH_SECRET
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: REDIS_URL
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MINIO_ENDPOINT
        - name: MINIO_PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MINIO_PORT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MINIO_SECRET_KEY
        - name: MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MINIO_BUCKET
        - name: MINIO_USE_SSL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MINIO_USE_SSL
        - name: MINIO_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: MINIO_PUBLIC_URL
        - name: VICTORIAMETRICS_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: VICTORIAMETRICS_URL
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: PORT
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: NODE_ENV
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: backend-config
              key: FRONTEND_URL
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: collector-shop
  labels:
    app: backend
spec:
  type: NodePort
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30000
    protocol: TCP
    name: http
  selector:
    app: backend
