---
# ServiceAccount ArgoCD pour Jenkins (utilisé pour déclencher les syncs depuis le pipeline)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-jenkins-sa
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: collector-shop-infra
---
# Role : permettre à Jenkins de lire et synchroniser les Applications ArgoCD
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-jenkins-role
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-jenkins-rolebinding
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-jenkins-role
subjects:
  - kind: ServiceAccount
    name: argocd-jenkins-sa
    namespace: argocd
