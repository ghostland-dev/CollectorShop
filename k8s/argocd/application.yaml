apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: collector-shop
  namespace: argocd
  labels:
    app.kubernetes.io/name: collector-shop
    app.kubernetes.io/part-of: collector-shop-infra
  # Finalizer : supprime les ressources Kubernetes lors de la suppression de l'Application
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    # Notifications Slack (optionnel — requiert argocd-notifications)
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: collector-shop-deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: collector-shop-deployments
spec:
  project: collector-shop

  # ─── Source : dépôt GitHub, overlay Minikube ───────────────────────────────
  source:
    repoURL: "https://github.com/Ismail-Mouyahada/CollectorShop.git"
    targetRevision: main
    path: k8s/overlays/minikube

  # ─── Destination : cluster Minikube, namespace collector-shop ──────────────
  destination:
    server: https://kubernetes.default.svc
    namespace: collector-shop

  # ─── Politique de synchronisation ──────────────────────────────────────────
  syncPolicy:
    automated:
      # Synchronisation automatique dès qu'ArgoCD détecte une différence
      prune: true       # supprime les ressources absentes du manifests
      selfHeal: true    # re-applique si quelqu'un modifie le cluster manuellement
    syncOptions:
      - CreateNamespace=true      # crée collector-shop s'il n'existe pas
      - PrunePropagationPolicy=foreground
      - PruneLast=true            # supprime en dernier (évite les races conditions)
      - ApplyOutOfSyncOnly=true   # n'applique que les ressources diff
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "3m"

  # ─── Seuils de santé (Health Assessment) ───────────────────────────────────
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas  # HPA gère les réplicas, ignorer les diffs de replicas

  # ─── Révision de l'historique conservée ────────────────────────────────────
  revisionHistoryLimit: 10
