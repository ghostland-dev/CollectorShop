version: 2
updates:
  # Configuration pour npm (workspace à la racine)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Groupes de mises à jour pour réduire le nombre de PRs
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # Permettre les mises à jour de sécurité même si elles sont majeures
    allow:
      - dependency-type: "production"
    # Ignorer les mises à jour majeures automatiques (sauf pour les mises à jour de sécurité)
    # Note: Les mises à jour de sécurité sont toujours créées, même si elles sont majeures
    # Cependant, pour éviter les problèmes avec esbuild et autres dépendances critiques,
    # on retire l'ignore global des mises à jour majeures
    # Si nécessaire, ignorer des dépendances spécifiques individuellement
    # ignore:
    #   - dependency-name: "some-package"
    #     update-types: ["version-update:semver-major"]
    # Labels pour les PRs
    labels:
      - "dependencies"
      - "npm"
