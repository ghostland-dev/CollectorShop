name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build et Lint
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate Prisma Client
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/collector_shop_test?schema=public

      - name: Lint backend
        run: npm run lint --workspace=backend
        continue-on-error: false

      - name: Lint frontend
        run: npm run lint --workspace=frontend
        continue-on-error: false

      - name: Build backend
        run: npm run build --workspace=backend

      - name: Build frontend
        run: npm run build --workspace=frontend

  # Job 2: Tests unitaires
  unit-tests:
    name: Tests Unitaires
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: collector_shop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Prisma
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/collector_shop_test?schema=public

      - name: Run migrations
        run: |
          cd backend
          npx prisma db push --accept-data-loss --skip-generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/collector_shop_test?schema=public

      - name: Run unit tests
        run: npm run test:coverage --workspace=backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/collector_shop_test?schema=public
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

      - name: Run frontend tests
        run: npm run test:coverage --workspace=frontend

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  # Job 3: Tests d'intégration
  integration-tests:
    name: Tests d'Intégration
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    permissions:
      contents: read
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: collector_shop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup Prisma
        run: |
          cd backend
          npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/collector_shop_test?schema=public

      - name: Run migrations
        run: |
          cd backend
          npx prisma db push --accept-data-loss --skip-generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/collector_shop_test?schema=public

      - name: Run integration tests
        run: npm run test --workspace=backend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/collector_shop_test?schema=public
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret

  # Job 4: Analyse de code (SonarQube)
  code-analysis:
    name: Analyse de Code
    runs-on: ubuntu-latest
    needs: [unit-tests]
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job 5: Scan de sécurité (Snyk)
  security-scan:
    name: Scan de Sécurité
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        id: snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Check if Snyk SARIF file exists
        id: check-snyk-sarif
        run: |
          if [ -f snyk.sarif ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Snyk results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.snyk.outcome == 'success' && steps.check-snyk-sarif.outputs.exists == 'true'
        continue-on-error: true
        with:
          sarif_file: snyk.sarif

  # Job 6: Scan de conteneur
  container-scan:
    name: Scan de Conteneur
    runs-on: ubuntu-latest
    needs: [build-and-lint]
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t collector-shop-backend:test -f backend/Dockerfile backend/
          docker build -t collector-shop-frontend:test -f frontend/Dockerfile .

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: collector-shop-backend:test
          format: 'sarif'
          output: 'trivy-backend-results.sarif'

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: collector-shop-frontend:test
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'

      - name: Check if Trivy SARIF files exist
        id: check-trivy-sarif
        run: |
          if [ -f trivy-backend-results.sarif ]; then
            echo "backend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "backend_exists=false" >> $GITHUB_OUTPUT
          fi
          if [ -f trivy-frontend-results.sarif ]; then
            echo "frontend_exists=true" >> $GITHUB_OUTPUT
          else
            echo "frontend_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check-trivy-sarif.outputs.backend_exists == 'true'
        continue-on-error: true
        with:
          sarif_file: trivy-backend-results.sarif

      - name: Upload Trivy frontend results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check-trivy-sarif.outputs.frontend_exists == 'true'
        continue-on-error: true
        with:
          sarif_file: trivy-frontend-results.sarif

  # Job 7: Build et push Docker image
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata and generate tags
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: Extract metadata and generate tags (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}-{{sha}},enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Output image tags
        run: |
          echo "Backend tags: ${{ steps.meta-backend.outputs.tags }}"
          echo "Frontend tags: ${{ steps.meta-frontend.outputs.tags }}"

  # Job 8: Déploiement (exemple)
  deploy:
    name: Déploiement Staging
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://staging.collector.shop
    
    steps:
      - name: Deploy to staging
        run: |
          echo "Déploiement vers staging..."
          echo "Images disponibles:"
          echo "Backend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest"
          echo "Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest"
          # Ici, ajouter les commandes de déploiement réelles
          # Exemple: kubectl, terraform, etc.

  # Job 9: Notification Discord
  notify-discord:
    name: Notification Discord
    runs-on: ubuntu-latest
    needs: [build-image, deploy]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine overall status
        id: status
        run: |
          if [ "${{ needs.build-image.result }}" == "success" ] && [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "color=3066993" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-image.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "color=15158332" >> $GITHUB_OUTPUT
          else
            echo "status=cancelled" >> $GITHUB_OUTPUT
            echo "emoji=⚠️" >> $GITHUB_OUTPUT
            echo "color=16776960" >> $GITHUB_OUTPUT
          fi

      - name: Build status message
        id: build-status
        run: |
          if [ "${{ needs.build-image.result }}" == "success" ]; then
            echo "message=✅ Images Docker buildées et publiées sur ghcr.io" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build-image.result }}" == "failure" ]; then
            echo "message=❌ Échec du build Docker" >> $GITHUB_OUTPUT
          else
            echo "message=⚠️ Build Docker annulé ou ignoré" >> $GITHUB_OUTPUT
          fi

      - name: Deploy status message
        id: deploy-status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "message=✅ Déploiement réussi" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "message=❌ Échec du déploiement" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" == "skipped" ]; then
            echo "message=⏭️ Déploiement ignoré (condition non remplie)" >> $GITHUB_OUTPUT
          else
            echo "message=⚠️ Déploiement annulé" >> $GITHUB_OUTPUT
          fi

      - name: Send Discord notification
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: "${{ steps.status.outputs.emoji }} CI/CD Pipeline - Collector.shop"
          description: |
            **État global**: ${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.status == 'success' && 'Succès' || steps.status.outputs.status == 'failure' && 'Échec' || 'Annulé' }}
            
            **📦 Build Docker**
            ${{ steps.build-status.outputs.message }}
            
            **🚀 Déploiement**
            ${{ steps.deploy-status.outputs.message }}
            
            ---
            **Branche**: `${{ github.ref_name }}`
            **Commit**: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Auteur**: ${{ github.actor }}
            **Message**: ${{ github.event.head_commit.message || github.event.pull_request.title || 'N/A' }}
            
            [📊 Voir les logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          color: ${{ steps.status.outputs.color }}
          username: "GitHub Actions"
          avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
