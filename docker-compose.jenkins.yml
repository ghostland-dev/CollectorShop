# Docker Compose - Jenkins CI/CD Local
# Collector.shop - Pipeline d'intégration continue
#
# Usage:
#   Démarrer : make jenkins-start
#   Arrêter  : make jenkins-stop
#   Logs     : make jenkins-logs
#   Interface: http://localhost:8080 (admin / admin)
#
# NOTE: Ce fichier est SÉPARÉ du docker-compose.yml principal.
# Il ne démarre PAS les services de l'application (postgres, redis, minio, etc.)
# Jenkins utilise ses propres conteneurs PostgreSQL éphémères pour les tests.

services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: collector-shop-jenkins
    user: root  # Nécessaire pour accéder au socket Docker
    ports:
      - "8080:8080"    # Interface Web Jenkins
      - "50000:50000"  # Port de communication agents Jenkins
    volumes:
      # Persistance des données Jenkins (jobs, plugins, config, builds)
      - jenkins_home:/var/jenkins_home
      # Accès au daemon Docker de l'hôte (pour builder des images et lancer des conteneurs)
      - /var/run/docker.sock:/var/run/docker.sock
      # Le projet monté en lecture : Jenkins le clone via file:// dans ses workspaces
      - .:/workspace/collector-shop:ro
      # Configuration JCasC
      - ./jenkins/casc.yaml:/var/jenkins_home/casc_configs/casc.yaml:ro
      # Git safe.directory : évite l'erreur "dubious ownership" sur le repo monté
      - ./jenkins/gitconfig:/root/.gitconfig:ro
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Xmx1g -Xms512m -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs
      # Variables transmises au pipeline pour les scans
      - DOCKER_HOST=unix:///var/run/docker.sock
    networks:
      - jenkins-ci-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s  # Jenkins met ~2min à démarrer la première fois

networks:
  # Réseau partagé entre Jenkins et les conteneurs de test
  # (ex: PostgreSQL éphémère démarré pendant le pipeline)
  jenkins-ci-net:
    name: jenkins-ci-net
    driver: bridge

volumes:
  jenkins_home:
    name: collector-shop-jenkins-home
    # Pour repartir de zéro : docker volume rm collector-shop-jenkins-home
