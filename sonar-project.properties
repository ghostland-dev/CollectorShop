sonar.projectKey=goodfood-apps_collector-shop
sonar.organization=goodfood-apps
sonar.projectName=collector-shop
sonar.host.url=https://sonarcloud.io

# Sources
sonar.sources=backend/src,frontend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.spec.ts,**/coverage/**

# Tests
sonar.tests=backend/src,frontend/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage (généré par jest --coverage)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json
