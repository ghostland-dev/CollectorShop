# Proxy HTTPS (port 443) → Minikube Ingress (32390)
# Usage: docker run -d --name nginx-443-proxy --network host \
#   -v $(pwd)/scripts/nginx-443-proxy.conf:/etc/nginx/nginx.conf:ro \
#   -v /path/to/certs:/certs:ro nginx:alpine

events { worker_connections 1024; }

http {
    # Production
    server {
        listen 443 ssl;
        server_name shopcollector.local api.shopcollector.local grafana.shopcollector.local;

        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://192.168.49.2:32390;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
        }
    }

    # Dev
    server {
        listen 443 ssl;
        server_name dev.shopcollector.local api-dev.shopcollector.local grafana-dev.shopcollector.local;

        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://192.168.49.2:32390;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
        }
    }

    # Staging
    server {
        listen 443 ssl;
        server_name staging.shopcollector.local api-staging.shopcollector.local grafana-staging.shopcollector.local;

        ssl_certificate     /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://192.168.49.2:32390;
            proxy_ssl_verify off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90;
        }
    }

    # Gitea
    server {
        listen 443 ssl;
        server_name gitea.shopcollector.local;
        ssl_certificate /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://192.168.49.2:31200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    # ArgoCD
    server {
        listen 443 ssl;
        server_name argocd.shopcollector.local;
        ssl_certificate /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://192.168.49.2:31080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    # Netdata
    server {
        listen 443 ssl;
        server_name netdata.shopcollector.local;
        ssl_certificate /certs/tls.crt;
        ssl_certificate_key /certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://192.168.49.2:30199;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;
        server_name shopcollector.local api.shopcollector.local grafana.shopcollector.local
                    dev.shopcollector.local api-dev.shopcollector.local grafana-dev.shopcollector.local
                    staging.shopcollector.local api-staging.shopcollector.local grafana-staging.shopcollector.local
                    gitea.shopcollector.local argocd.shopcollector.local netdata.shopcollector.local;
        return 308 https://$host$request_uri;
    }
}
